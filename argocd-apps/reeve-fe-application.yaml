apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reeve-fe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/youn9jin/reeve-community-gitops.git
    targetRevision: main
    path: apps/reeve-fe
  destination:
    server: https://kubernetes.default.svc
    namespace: community
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
